name: Fetch mods

# Запускается вручную: Actions -> Fetch mods -> Run workflow.
# Скачивает моды (и их обязательные зависимости) с Modrinth на серверах GitHub
# и кладёт их в Release mods-<версия>, откуда их берёт лаунчер (работает без VPN).

on:
  workflow_dispatch:
    inputs:
      mc_version:
        description: "Версия Minecraft"
        default: "1.21.11"
      mods:
        description: "Моды (slug через пробел; slug@версия - закрепить версию)"
        default: "fabric-api sodium@0.8.12 lithium ferrite-core modernfix immediatelyfast memoryleakfix voxy modmenu ebe cull-leaves moreculling entityculling immersive-optimization too-many-entities entityopt"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать моды с Modrinth
        env:
          MC: ${{ inputs.mc_version }}
          MODS: ${{ inputs.mods }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, sys, urllib.parse, urllib.request
          mc = os.environ["MC"]
          os.makedirs("mods", exist_ok=True)
          H = {"User-Agent": "FastLauncher-mods-fetch"}

          def get(url):
              return urllib.request.urlopen(urllib.request.Request(url, headers=H), timeout=60)

          def api(path):
              return json.load(get("https://api.modrinth.com/v2" + path))

          def newest(vers, pin=""):
              vers = [v for v in vers if "fabric" in v["loaders"] and mc in v["game_versions"]]
              if pin:
                  rx = re.compile(r"(?<!\d)" + re.escape(pin) + r"(?!\d)")
                  vers = [v for v in vers if rx.search(v["version_number"]) or any(rx.search(x["filename"]) for x in v["files"])]
                  if not vers:
                      raise RuntimeError(f"нет версии {pin} под {mc}")
              if not vers:
                  raise RuntimeError(f"нет версии под {mc}")
              vers.sort(key=lambda v: (v["version_type"] == "release", v["date_published"]), reverse=True)
              return vers[0]

          def download(v):
              files = v["files"]
              f = next((x for x in files if x.get("primary")), files[0])
              data = get(f["url"]).read()
              if hashlib.sha512(data).hexdigest() != f["hashes"]["sha512"]:
                  raise RuntimeError("хеш не совпал")
              open(os.path.join("mods", f["filename"]), "wb").write(data)
              return f["filename"]

          index = {"mods": {}, "deps": {}}
          seen = set()      # id уже скачанных проектов
          want_deps = {}    # id проекта -> id нужной версии (или None)
          failed = []

          for token in os.environ["MODS"].split():
              slug, _, pin = token.partition("@")
              try:
                  q = urllib.parse.urlencode({"loaders": json.dumps(["fabric"]), "game_versions": json.dumps([mc])})
                  v = newest(api(f"/project/{slug}/version?{q}"), pin)
                  index["mods"][slug] = download(v)
                  seen.add(v["project_id"])
                  for d in v.get("dependencies", []):
                      if d["dependency_type"] == "required" and d.get("project_id"):
                          want_deps.setdefault(d["project_id"], d.get("version_id"))
                  print("OK  ", slug, index["mods"][slug])
              except Exception as e:
                  print("FAIL", slug, e)
                  failed.append(slug)

          # обязательные зависимости (Cloth Config и т.п.)
          for pid, vid in want_deps.items():
              if pid in seen:
                  continue
              try:
                  slug = api(f"/project/{pid}")["slug"]
                  if vid:
                      v = api(f"/version/{vid}")
                  else:
                      q = urllib.parse.urlencode({"loaders": json.dumps(["fabric"]), "game_versions": json.dumps([mc])})
                      v = newest(api(f"/project/{pid}/version?{q}"))
                  index["deps"][slug] = download(v)
                  seen.add(pid)
                  print("DEP ", slug, index["deps"][slug])
              except Exception as e:
                  print("FAIL dependency", pid, e)
                  failed.append("зависимость " + pid)

          json.dump(index, open("index.json", "w"), ensure_ascii=False, indent=1)
          if failed:
              print(f"::warning::Не скачались: {', '.join(failed)}")
          if not index["mods"]:
              print("::error::Ни один мод не скачался")
              sys.exit(1)
          PY

      - name: Опубликовать в Release
        env:
          GH_TOKEN: ${{ github.token }}
          MC: ${{ inputs.mc_version }}
        run: |
          TAG="mods-$MC"
          # пересоздаём релиз, чтобы старые версии не остались рядом с новыми
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Моды $MC" --notes "Моды для FastLauncher ($MC)"
          gh release upload "$TAG" mods/*.jar index.json --repo "$GITHUB_REPOSITORY" --clobber
