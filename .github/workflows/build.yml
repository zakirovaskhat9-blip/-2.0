name: Build Enchanted.exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Собрать клиентский мод
        shell: pwsh
        working-directory: client-mod
        run: |
          gradle build --no-daemon
          New-Item -ItemType Directory -Force -Path ../Enchanted/client_mod | Out-Null
          Get-ChildItem build/libs/enchanted-client-*.jar | Where-Object { $_.Name -notmatch 'sources|dev' } | Select-Object -First 1 | Copy-Item -Destination ../Enchanted/client_mod/enchanted-client.jar

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Иконка
        run: |
          pip install pillow
          cd tools
          python make_icon.py ../Enchanted/enchanted.ico

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Собрать лаунчер
        run: dotnet publish Enchanted/Enchanted.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish

     
      - name: Загрузить LT6MS Launcher
        uses: actions/upload-artifact@v4
        with:
          name: LT6MS-Launcher
          path: 'publish/LT6MS Launcher.exe'
          if-no-files-found: error
